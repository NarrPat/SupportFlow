[project]
name = "supportflow"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
description = "SupportFlow development environment"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23",
    "celery[redis]>=5.4,<6",
    "deepseek-recipe==0.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "fastapi>=0.115,<1",
    "fastembed>=0.7,<1",
    "httpx>=0.27,<1",
    "jieba==0.42.1",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "pgvector>=0.3,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2,<3",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
