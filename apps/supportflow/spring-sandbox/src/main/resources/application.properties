server.port=8001
server.error.include-message=never
server.error.include-stacktrace=never
spring.flyway.enabled=false
spring.config.import=configtree:/run/secrets/
spring.datasource.url=${SF_JAVA_JDBC_URL}
spring.datasource.username=sf_java_runtime
spring.datasource.password=${java_runtime_password}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=4
sf.service-token-file=/run/secrets/sandbox_service_token
