# Explicit worker overlay. Loading the web profile alone never calls a model.
x-job: &job
  image: sf-local-python-dev:env
  pull_policy: never
  platform: linux/amd64
  working_dir: /work
  read_only: true
  tmpfs: [/tmp]
  environment: &job-environment
    PYTHONDONTWRITEBYTECODE: "1"
    PGHOST: postgres
    PGDATABASE: ${SF_WEB_APP_DB:-sf_app}
    PGPASSWORD_FILE: /run/secrets/app_runtime_password
    SF_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    SF_CELERY_QUEUE: supportflow
  volumes:
    - ../../apps/supportflow/jobs:/work/apps/supportflow/jobs:ro
    - ../../apps/supportflow/agent:/work/apps/supportflow/agent:ro
    - ../../apps/supportflow/domain:/work/apps/supportflow/domain:ro
    - ../../apps/supportflow/retrieval:/work/apps/supportflow/retrieval:ro
    - ../../apps/supportflow/knowledge:/work/apps/supportflow/knowledge:ro
  secrets: [app_runtime_password, redis_password]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  api:
    environment:
      SF_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [app_runtime_password, redis_password]
  worker:
    <<: *job
    environment:
      <<: *job-environment
      SF_MODEL_KEY_FILE: /run/secrets/deepseek_api_key
    secrets: [app_runtime_password, redis_password, deepseek_api_key]
    networks: [default, edge]
    command: [celery, -A, "apps.supportflow.jobs.worker:app", worker, --pool=prefork, --concurrency=2, "--hostname=sf-worker@%h", --loglevel=INFO, --without-gossip, --without-mingle]
    healthcheck:
      test: [CMD, python, -B, -m, apps.supportflow.jobs.health]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  dispatcher:
    <<: *job
    command: [python, -B, -m, apps.supportflow.jobs.dispatcher]
  scanner:
    <<: *job
    command: [python, -B, -m, apps.supportflow.jobs.scanner]

networks:
  edge: {}
secrets:
  deepseek_api_key: {file: "${SF_MODEL_KEY_SOURCE:-./.secrets/deepseek_api_key}"}
