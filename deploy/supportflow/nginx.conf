# Access logs contain method/status only. Do not log untrusted URLs, headers or bodies.
log_format sf_safe '$request_method $status';
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout sf_safe;
    root /usr/share/nginx/html;
    # 2MiB file plus bounded multipart metadata; the API checks exact file bytes.
    client_max_body_size 3m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
